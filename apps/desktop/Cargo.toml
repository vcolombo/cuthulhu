[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
geometry = { path = "../../crates/geometry" }
document = { path = "../../crates/document" }
fileio = { path = "../../crates/fileio" }
cutplan = { path = "../../crates/cutplan" }
driver-core = { path = "../../crates/driver-core" }
driver-registry = { path = "../../crates/driver-registry" }
cut-host = { path = "../../crates/cut-host" }
trace = { path = "../../crates/trace" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
tempfile = "3"

# The Dock's Quit and a logout reach the app only through `applicationShouldTerminate:`, which tao
# does not implement. `objc2` is already in `Cargo.lock` through tauri; this makes it a direct
# dependency so `terminate.rs` can add the method (#336).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Both are already in `Cargo.lock` as build-time dependencies of `tauri-macros`, so this adds a
# lockfile edit rather than a crate to the tree. `heck` is pinned to the same major the command
# macro itself uses: `tests/ipc_inventory.rs` has to reproduce Tauri's argument casing exactly, and
# reimplementing that conversion is how the two spellings would drift.
[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
heck = "0.5"
# `tauri::test`'s mock runtime runs the close hook against a real `CloseRequestApi` (#326).
tauri = { version = "2", features = ["test"] }
