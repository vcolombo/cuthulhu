name: CI

on:
  # A branch push and its pull request used to run the whole suite twice for one commit: two
  # draws from the runner pool for one answer, and two chances to draw a runner whose apt mirror
  # never responds (#269). The pull request run is the one a merge is gated on, so it is the one
  # kept. `main` keeps a run of its own because a merge commit is a state no PR run ever tested.
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing left to say, and a wedged one holds its runner until GitHub's
# six-hour ceiling: four commits in half an hour once left seven live runs, three still burning a
# runner hours later (#269). Grouped by ref, so a new commit retires the previous run for that
# branch and nothing else. Cancelling is for pull requests only — every commit that lands on
# `main` keeps a result of its own, which is what makes a red `main` attributable to one merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tools:
    runs-on: ubuntu-latest
    # Bounded well under the six-hour default: a stall that a re-run clears in a minute should
    # cost minutes and say so, not hold a required check all day (#269). Every ceiling here is
    # several times the job's observed runtime, so it fires for a wedge and never for a slow run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run spike tool tests
        run: cd tools && python -m pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Retried because a hosted runner's apt mirror can refuse or stall a single fetch, and one
      # unlucky package should not fail a build that has nothing to do with it. Retries cover the
      # mirror that answers slowly; the job timeout covers the one that never answers at all.
      - name: Install native deps (serialport needs libudev; Tauri 2 needs webkit2gtk/gtk3/rsvg2)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libudev-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # --locked is the Rust half of the discipline the ui job already gets from `npm ci`:
      # refuse to proceed when the lockfile disagrees with the manifests. Without it cargo
      # quietly rewrites Cargo.lock mid-build, so a dependency added without committing the
      # lock passes every check and only shows up as a dirty tree in a fresh checkout.
      - name: Build and test workspace
        run: cargo test --workspace --locked

  # `crates/cut-host` exists to run on a Raspberry Pi, and `docs/cut-host.md`'s first instruction is
  # this exact command — but nothing built for that target, so a dependency bump could leave the
  # documented first step failing with nothing here to notice. The risk is not theoretical: `ring`
  # (under rustls) and `libudev` (under serialport) are precisely the dependencies that break on a
  # cross build, and both are on the Cut Host's path.
  #
  # A real `cross build` rather than a cheaper `cargo check --target`: the linker is the part most
  # likely to break, and checking would not reach it. Runs alongside the other jobs, so it does not
  # slow the test job. `--locked` for the same reason the workspace test has it.
  cross-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --locked
      # No environment set here on purpose: the target's libudev is installed into the image by
      # `Cross.toml`, and where pkg-config looks for it comes from `.cargo/config.toml`. Anything
      # that lived only in this file would make the documented command fail for everyone else.
      # --no-default-features drops the desktop client and its resolver stack (tokio,
      # hickory, mdns-sd): the daemon never resolves a name, and the Pi build should not
      # have to cross-compile what it cannot call.
      - name: Cross build the daemon for the Pi
        run: cross build --release --locked --target aarch64-unknown-linux-gnu -p cut-host --bin cuthulhu-cutd --no-default-features

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # dist/ is committed because tauri::generate_context! reads frontendDist at compile time,
      # so the rust job (which installs no Node) needs it present to build at all. That makes it
      # an artifact git can hold stale: change ui/src, commit without bundling, and a packaged
      # build ships a frontend nobody wrote. The build above just regenerated it, so any
      # difference here means the committed copy did not match ui/src.
      - name: Fail if the committed bundle is stale
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::apps/desktop/ui/dist does not match a fresh build of ui/src. Run 'npm --prefix apps/desktop/ui run build' and commit the result."
            git status --short -- dist
            exit 1
          fi
      - name: Unit tests
        run: npm test
      # `--with-deps` runs apt itself, so the retry the rust job passes on the command line has to
      # live in apt's own config to reach it: this is the same stall, in the other job it wedged.
      - name: Give apt the same retries before it installs the browser's system libraries
        run: echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-cuthulhu-retries
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run e2e
