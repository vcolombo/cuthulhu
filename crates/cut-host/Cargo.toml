[package]
name = "cut-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "cuthulhu-cutd"
path = "src/bin/cuthulhu-cutd.rs"

[dependencies]
cutplan = { path = "../cutplan" }
driver-core = { path = "../driver-core" }
driver-registry = { path = "../driver-registry" }
geometry = { path = "../geometry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
