[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "desktop"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
geometry = { path = "../../crates/geometry" }
document = { path = "../../crates/document" }
fileio = { path = "../../crates/fileio" }
cutplan = { path = "../../crates/cutplan" }
driver-core = { path = "../../crates/driver-core" }
driver-registry = { path = "../../crates/driver-registry" }
cut-host = { path = "../../crates/cut-host" }
trace = { path = "../../crates/trace" }
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
tempfile = "3"

# Both are already in `Cargo.lock` as build-time dependencies of `tauri-macros`, so this adds a
# lockfile edit rather than a crate to the tree. `heck` is pinned to the same major the command
# macro itself uses: `tests/ipc_inventory.rs` has to reproduce Tauri's argument casing exactly, and
# reimplementing that conversion is how the two spellings would drift.
[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
heck = "0.5"
