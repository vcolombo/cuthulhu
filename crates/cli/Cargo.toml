[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "cuthulhu"
path = "src/main.rs"

[dependencies]
geometry = { path = "../geometry" }
document = { path = "../document" }
fileio = { path = "../fileio" }
cutplan = { path = "../cutplan" }
driver-core = { path = "../driver-core" }
driver-registry = { path = "../driver-registry" }
driver-silhouette = { path = "../driver-silhouette" }
driver-hpgl = { path = "../driver-hpgl" }
trace = { path = "../trace" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
