# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cut-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "cuthulhu-cutd"
path = "src/bin/cuthulhu-cutd.rs"

[dependencies]
cutplan = { path = "../cutplan" }
driver-core = { path = "../driver-core" }
driver-registry = { path = "../driver-registry" }
geometry = { path = "../geometry" }
# Only for `signal`/SIGTERM in `shutdown`: std has no signal handling, and libc
# was already in the tree under rustls and socket2 rather than a crate added for it.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
toml = "0.8"
# The desktop's client half only. The daemon never resolves a name — it binds — so the
# resolver stack (tokio + hickory + mdns-sd) is feature-gated out of the Pi cross build,
# which passes --no-default-features. Default-on so `cargo test --workspace` needs no flag.
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"], optional = true }
mdns-sd = { version = "0.21", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }

[features]
default = ["client"]
client = ["dep:tokio", "dep:hickory-resolver", "dep:mdns-sd"]

[dev-dependencies]
tempfile = "3"
